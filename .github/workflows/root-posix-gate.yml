name: root-posix-gate

on:
  push:
    branches:
      - codex/root-posix-gate-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d8d5257461cc31d9ef715396fba01fc7d11660dd
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package and runtime dependencies
        run: python -m pip install -e .
      - name: Run the full suite as root
        run: |
          PYTHON_BIN="$(command -v python)"
          sudo -n env PYTHONPATH="$GITHUB_WORKSPACE" "$PYTHON_BIN" -m unittest discover -s tests -v